<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>App Piano — Sheet Music & Keys Adapted to Any Piano</title>
    
    <!-- Meta tags para PWA y SEO -->
    <meta name="description" content="Adapts every song to an easy-to-understand piano sheet music and interactive keys tailored to your keyboard size." />
    <meta name="theme-color" content="#25140d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="App Piano" />

    <!-- Iconos y Manifest PWA -->
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="manifest" href="./manifest.json" />

    <!-- Tipografía Google Fonts opcional con fallback elegante de sistema -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app"></div>
    <!-- Contenedor del visor horizontal inmersivo para teléfonos móviles -->
    <div id="landscape-modal-container"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
